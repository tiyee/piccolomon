name: Build unsigned MSIX bundle for Store
run-name: Unsigned MSIX bundle ${{ inputs.version }} (Windows x86, x64, arm64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Store package version (e.g. 1.0.0.0; each component 0-65535 and revision 0; independent of Cargo)'
        required: true
        type: string
      identity_name:
        description: 'Partner Center: Package/Identity/Name'
        required: true
        type: string
      publisher:
        description: 'Partner Center: Package/Identity/Publisher (CN=...)'
        required: true
        type: string
      publisher_display_name:
        description: 'Partner Center: Package/Properties/PublisherDisplayName'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-msix:
    name: Build MSIX (${{ matrix.architecture }})
    runs-on: windows-2025
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86
            target: i686-pc-windows-msvc
          - architecture: x64
            target: x86_64-pc-windows-msvc
          - architecture: arm64
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
      # ring needs Clang on Windows ARM64. clang-cl uses the MSVC toolchain.
      CC_aarch64_pc_windows_msvc: clang-cl
      STORE_VERSION: ${{ inputs.version }}
      STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
      STORE_PUBLISHER: ${{ inputs.publisher }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
      STORE_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Store inputs
        run: |
          if ($env:STORE_VERSION -notmatch '^\d{1,5}\.\d{1,5}\.\d{1,5}\.0$' -or
              @($env:STORE_VERSION.Split('.') | Where-Object { [int]$_ -gt 65535 }).Count) {
            throw 'MSIX version must be major.minor.build.0 with each component between 0 and 65535.'
          }
          foreach ($key in @('STORE_IDENTITY_NAME', 'STORE_PUBLISHER', 'STORE_PUBLISHER_DISPLAY_NAME')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($key))) {
              throw "Provide $key from Partner Center > Product identity."
            }
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: unsigned-msix-windows-${{ matrix.architecture }}
      - name: Build and pack unsigned MSIX
        run: |
          ./scripts/bundle-windows-store.ps1 -Version $env:STORE_VERSION `
            -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME -Architecture $env:STORE_ARCHITECTURE
      - name: Upload bundle input
        uses: actions/upload-artifact@v7
        with:
          name: ryne-msix-${{ matrix.architecture }}-input
          path: dist/store/Ryne-${{ inputs.version }}-${{ matrix.architecture }}.msix
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  bundle-msix:
    name: Bundle all architectures
    needs: build-msix
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      STORE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ryne-msix-*-input
          path: bundle-input
          merge-multiple: true
      - name: Create unsigned MSIX bundle
        run: |
          $version = $env:STORE_VERSION
          $architectures = @('arm64', 'x64', 'x86')
          $expected = @($architectures | ForEach-Object { "Ryne-$version-$_.msix" })
          $actual = @(Get-ChildItem -LiteralPath bundle-input -Name | Sort-Object)
          if (($actual -join ',') -cne ($expected -join ',')) {
            throw "Expected exactly the three architecture packages. Found: $($actual -join ', ')"
          }
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $makeAppx = Get-ChildItem -Path (Join-Path $sdkBin '*/x64/makeappx.exe') -File |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $makeAppx) { throw 'Windows SDK MakeAppx.exe is required.' }

          $bundleName = "Ryne-$version.msixbundle"
          $bundle = Join-Path $PWD $bundleName
          & $makeAppx.FullName bundle /d bundle-input /p $bundle /bv $version /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx bundle failed with exit code $LASTEXITCODE." }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($bundle)
          try {
            $entry = $archive.GetEntry('AppxMetadata/AppxBundleManifest.xml')
            if (-not $entry) { throw 'Bundle manifest is missing.' }
            $stream = $entry.Open()
            try {
              $manifest = [System.Xml.XmlDocument]::new()
              $manifest.Load($stream)
            } finally {
              $stream.Dispose()
            }
            $included = @($manifest.Bundle.Packages.Package | ForEach-Object { $_.Architecture } | Sort-Object)
            if (($included -join ',') -cne ($architectures -join ',')) {
              throw "Unexpected bundle architectures: $($included -join ', ')"
            }
          } finally {
            $archive.Dispose()
          }
          $hash = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $bundleName" | Set-Content -LiteralPath "$bundle.sha256" -Encoding utf8NoBOM
      - name: Upload unsigned MSIX bundle
        uses: actions/upload-artifact@v7
        with:
          name: Ryne-${{ inputs.version }}-windows-unsigned-msixbundle
          path: |
            Ryne-${{ inputs.version }}.msixbundle
            Ryne-${{ inputs.version }}.msixbundle.sha256
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30
