[package]
name = "ryne-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
p1-metrics = ["ryne-syntax/query-metrics"]

[dependencies]
ryne-session.workspace = true
ryne-core.workspace = true
ryne-syntax.workspace = true
ryne-projection.workspace = true
ryne-extensions.workspace = true
ryne-parser.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
async-channel.workspace = true
url.workspace = true
unicode-segmentation.workspace = true
image.workspace = true

serde_json.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
resvg.workspace = true
gpui = { workspace = true, features = ["test-support"] }
ryne-features.workspace = true
ryne-services.workspace = true

[target.'cfg(windows)'.dependencies]
uuid = { version = "=1.28.0", features = ["v4"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop"] }
